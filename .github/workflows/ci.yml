          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break swarm.mjs, then READ the verdict (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate swarm.mjs             --timeout 60000 --cap 500 --baseline witness.baseline.json             --test node --test swarm.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
